name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libudev-dev libpcsclite-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Relais NCI (C, avec sanitizers) et parcours Coffre → relais
        run: |
          make -C contrib/nci-bridge check CFLAGS="-O1 -g -fsanitize=address,undefined"
          make -C contrib/nci-bridge clean test_nci_bridge
          COFFRE_NCI_BRIDGE=contrib/nci-bridge/test_nci_bridge cargo test --locked pont_c -- --ignored

  # Paquet natif postmarketOS (Alpine 3.24 = postmarketOS v26.06), compilé
  # dans un conteneur lancé à la main : les actions JavaScript ne tournent pas
  # dans un conteneur Alpine sur les exécuteurs ARM64.
  apk:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src" alpine:3.24 /src/packaging/postmarketos/build-apk.sh
