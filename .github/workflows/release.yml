name: Publication

on:
  push:
    tags: ["v*"]
  # Publication manuelle : crée l'étiquette `version` sur le commit choisi.
  workflow_dispatch:
    inputs:
      version:
        description: "Étiquette à publier (ex. v0.2.1)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  # Paquets natifs postmarketOS / Alpine 3.24.
  apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la version de l'APKBUILD
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' packaging/postmarketos/APKBUILD)
          test "v$pkgver" = "$TAG" || { echo "APKBUILD ($pkgver) ≠ $TAG"; exit 1; }
      - run: docker run --rm -v "$PWD:/src" alpine:3.24 /src/packaging/postmarketos/build-apk.sh
      - name: Renommer par architecture
        run: |
          cd dist
          for f in coffre-*.apk; do sudo mv "$f" "${f%.apk}-${{ matrix.arch }}.apk"; done
          for f in *.rsa.pub; do sudo mv "$f" "coffre-${{ matrix.arch }}.rsa.pub"; done
          sha256sum coffre-*-${{ matrix.arch }}.apk | sudo tee coffre-${{ matrix.arch }}.apk.sha256
          if [ "${{ matrix.arch }}" != aarch64 ]; then sudo rm -f APKBUILD coffre-*.tar.gz; fi
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: dist/*

  # Binaires glibc (Debian, Ubuntu, Fedora…), sans paquet.
  binaires:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Archive
        run: |
          name=coffre-${TAG}-linux-glibc-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/release/coffre "$name/"
          cp -r data LICENSE README.md install.sh "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binaire-${{ matrix.arch }}
          path: coffre-*.tar.gz*

  publier:
    needs: [apk, binaires]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Notes de version
        run: |
          version=${TAG#v}
          test -n "$version"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Coffre ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            artefacts/apk-*/*.apk
            artefacts/apk-*/*.sha256
            artefacts/apk-*/*.rsa.pub
            artefacts/apk-aarch64/APKBUILD
            artefacts/apk-aarch64/coffre-*.tar.gz
            artefacts/binaire-*/*.tar.gz
            artefacts/binaire-*/*.sha256
