[package]
name = "coffre"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Client Bitwarden adaptatif pour Phosh (GTK4/libadwaita)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
rbw = "1.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
