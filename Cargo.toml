[package]
name = "coffre"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
description = "Client Bitwarden adaptatif pour Phosh (GTK4/libadwaita)"
license = "GPL-3.0-only"
publish = false

# SDK officiel Bitwarden, utilisé sous l'option GPL-3.0 de sa double licence.
# Les crates de `bitwarden_license/` (licence SDK seule) ne sont pas utilisées.
[dependencies.bitwarden-core]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"
features = ["internal"]

[dependencies.bitwarden-auth]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"

[dependencies.bitwarden-crypto]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"

[dependencies.bitwarden-vault]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"

[dependencies.bitwarden-api-api]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"

[dependencies.bitwarden-state]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"

[dependencies.bitwarden-generators]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"

[dependencies.bitwarden-send]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"

[dependencies.bitwarden-exporters]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"

[dependencies.bitwarden-importers]
git = "https://github.com/bitwarden/sdk-internal.git"
rev = "57446279c2a91208d352fac6977c7a15212c3fcb"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2"
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
url = "2"
webauthn-rs-proto = "0.5.5"
uuid = { version = "1", features = ["v4"] }
# Clés de sécurité FIDO2 (CTAP2) par USB (hidraw) ou NFC (lecteurs PC/SC).
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["usb", "nfc"] }

[dev-dependencies]
# Clé logicielle pour tester le parcours WebAuthn sans matériel.
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
